<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="./favicon.ico">
    <title>驾校预约学习系统</title>
    <link href="./css/app.ac213acd.css?v=2" rel="preload" as="style">
    <link href="./css/chunk-vendors.a72b0961.css?v=2" rel="preload" as="style">
    <link href="./js/app.364205b5.js?v=2" rel="preload" as="script">

    <link href="./css/app.ac213acd.css?v=2" rel="stylesheet">
    <style>
         :root {
            --publicMainColor: #3182CE;
            --publicSubColor: #EFF6FF;
            --publicMainColorDeep: #1E40AF;
            --publicMainColorDark: #2B6CB0;
            --publicPageBg: #F0F7FF;
            --publicCardBg: #FFFFFF;
            --publicTextColor: #1A2C3E;
            --publicTextMuted: #5A6D82;
            --publicBorderColor: #D7E7F8;
            --publicShadow: 0 12px 32px rgba(43, 108, 176, .12)
        }
        
        html,
        body,
        #app {
            min-height: 100%;
            height: 100%
        }
        
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif!important;
            background: linear-gradient(180deg, var(--publicPageBg) 0%, #f7fbff 100%)!important;
            color: var(--publicTextColor)!important
        }
        
        button,
        input,
        textarea,
        select {
            font-family: inherit!important
        }
        
        .el-container,
        .el-main,
        .el-aside,
        .router-view {
            background: transparent!important
        }
        
        .navbar {
            background: linear-gradient(135deg, var(--publicMainColor) 0%, var(--publicMainColorDeep) 100%)!important;
            box-shadow: 0 12px 32px rgba(30, 64, 175, .18)!important;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            padding: 0 28px!important;
            height: 72px!important;
            line-height: 72px!important
        }
        
        .navbar .right-menu {
            right: 28px!important
        }
        
        .navbar .title-name {
            color: #fff!important;
            font-weight: 700!important;
            letter-spacing: .02em
        }
        
        .navbar .user-info {
            color: #EAF4FF!important;
            font-size: 14px!important
        }
        
        .navbar .logout {
            height: 38px;
            line-height: 38px;
            padding: 0 14px!important;
            border-radius: 999px;
            color: #fff!important;
            transition: all .2s ease
        }
        
        .navbar .logout:hover {
            background: rgba(255, 255, 255, .16)!important
        }
        
        .index-aside {
            padding: 20px 0 20px 20px;
            box-sizing: border-box;
            background: transparent!important
        }
        
        .index-aside .index-aside-inner {
            padding-top: 92px!important
        }
        
        .index-aside .menulist-item {
            width: 220px!important;
            background: rgba(255, 255, 255, .95)!important;
            border: 1px solid var(--publicBorderColor)!important;
            border-radius: 18px!important;
            box-shadow: var(--publicShadow)!important;
            padding: 14px 0!important
        }
        
        .index-aside .el-menu-demo {
            min-height: calc(100vh - 112px)!important;
            background: transparent!important
        }
        
        .index-aside .el-menu-demo>.el-menu-item,
        .index-aside .el-submenu__title {
            margin: 4px 12px!important;
            padding: 10px 18px!important;
            border-radius: 12px!important;
            background: #F7FBFF!important;
            color: var(--publicTextColor)!important;
            font-size: 14px!important;
            font-weight: 600!important;
            height: auto!important;
            line-height: 1.6!important
        }
        
        .index-aside .el-menu-demo>.el-menu-item:hover,
        .index-aside .el-submenu__title:hover {
            background: #EAF4FF!important;
            color: var(--publicMainColorDark)!important
        }
        
        .index-aside .el-menu--inline {
            margin: 4px 12px 8px 24px!important
        }
        
        .index-aside .el-menu--inline .el-menu-item {
            height: 38px!important;
            line-height: 38px!important;
            border-radius: 10px!important;
            color: var(--publicTextMuted)!important
        }
        
        .index-aside .el-menu--inline .el-menu-item:hover,
        .index-aside .el-menu--inline .el-menu-item.is-active {
            background: #EAF4FF!important;
            color: var(--publicMainColor)!important;
            font-weight: 600!important
        }
        
        .el-main {
            padding: 20px 24px 24px!important;
            min-height: 100vh!important
        }
        
        .app-breadcrumb {
            height: 52px!important;
            line-height: 52px!important;
            padding: 0 20px!important;
            border-radius: 12px!important;
            background: rgba(255, 255, 255, .92)!important;
            border: 1px solid var(--publicBorderColor)!important;
            box-shadow: var(--publicShadow)!important
        }
        
        .app-breadcrumb .el-breadcrumb__inner,
        .app-breadcrumb .el-breadcrumb__inner a {
            color: var(--publicTextMuted)!important
        }
        
        .app-breadcrumb .no-redirect {
            color: var(--publicTextColor)!important;
            font-weight: 600!important
        }
        
        .router-view {
            margin-top: 20px!important;
            background: transparent!important
        }
        
        .form-content,
        .table-content,
        .detail-form-content,
        .el-card,
        .el-dialog,
        .el-message-box {
            background: var(--publicCardBg)!important;
            border: 1px solid var(--publicBorderColor)!important;
            border-radius: 12px!important;
            box-shadow: var(--publicShadow)!important
        }
        
        .form-content {
            padding: 24px 24px 0!important
        }
        
        .table-content {
            padding: 8px 24px 20px!important
        }
        
        .detail-form-content {
            padding: 24px!important
        }
        
        .el-dialog__header,
        .el-message-box__header {
            border-bottom: 1px solid #EDF4FB
        }
        
        .el-dialog__title,
        .el-form-item__label,
        .el-card__header,
        .el-descriptions__title {
            color: var(--publicTextColor)!important;
            font-weight: 600!important
        }
        
        .el-input__inner,
        .el-textarea__inner,
        .el-select .el-input__inner,
        .el-date-editor .el-input__inner {
            border: 1px solid var(--publicBorderColor)!important;
            border-radius: 10px!important;
            background: #FDFEFE!important;
            color: var(--publicTextColor)!important;
            box-shadow: none!important;
            height: 42px!important;
            line-height: 42px!important
        }
        
        .el-textarea__inner {
            min-height: 120px!important;
            line-height: 1.7!important
        }
        
        .el-input__inner:focus,
        .el-textarea__inner:focus {
            border-color: var(--publicMainColor)!important;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, .12)!important
        }
        
        .el-button {
            border-radius: 8px!important;
            padding: 10px 18px!important;
            font-weight: 600!important;
            transition: all .2s ease!important
        }
        
        .el-button--primary {
            background: linear-gradient(135deg, var(--publicMainColor) 0%, var(--publicMainColorDeep) 100%)!important;
            border-color: var(--publicMainColor)!important
        }
        
        .el-button--primary:hover,
        .el-button--primary:focus {
            background: linear-gradient(135deg, var(--publicMainColorDark) 0%, var(--publicMainColorDeep) 100%)!important;
            border-color: var(--publicMainColorDark)!important
        }
        
        .el-button--default,
        .el-button--primary.is-plain,
        .el-button--success.is-plain,
        .el-button--warning.is-plain,
        .el-button--danger.is-plain {
            background: #fff!important;
            color: var(--publicMainColorDark)!important;
            border-color: #CFE0F3!important
        }
        
        .el-button.is-disabled,
        .el-button.is-disabled:hover,
        .el-button.is-disabled:focus {
            opacity: .55!important
        }
        
        .el-table {
            color: var(--publicTextColor)!important;
            border-radius: 12px!important;
            overflow: hidden!important
        }
        
        .el-table th,
        .el-table th.el-table__cell {
            background: #EEF6FF!important;
            color: var(--publicTextColor)!important;
            font-weight: 700!important;
            border-bottom-color: #D9E8F8!important
        }
        
        .el-table td.el-table__cell,
        .el-table th.el-table__cell.is-leaf {
            border-bottom: 1px solid #EBF3FB!important
        }
        
        .el-table .el-table__row:hover>td {
            background: #F0F7FF!important
        }
        
        .el-pagination .btn-next,
        .el-pagination .btn-prev,
        .el-pagination .el-pager li {
            border-radius: 8px!important;
            background: #fff!important;
            border: 1px solid #D8E7F8!important;
            color: var(--publicTextMuted)!important
        }
        
        .el-pagination .el-pager li.active {
            background: var(--publicMainColor)!important;
            border-color: var(--publicMainColor)!important;
            color: #fff!important
        }
        
        .el-upload--picture-card {
            width: 120px!important;
            height: 120px!important;
            border-radius: 12px!important;
            border: 1px dashed #9FC0E6!important;
            background: #F5FAFF!important
        }
        
        .el-upload-list--picture-card .el-upload-list__item {
            border-radius: 12px!important;
            border-color: #CFE0F3!important
        }
        
        .el-upload--picture-card:hover,
        .el-upload-list--picture-card .el-upload-list__item:hover {
            border-color: var(--publicMainColor)!important
        }
        
        .el-upload__tip {
            color: var(--publicTextMuted)!important
        }
        
        .loginIn {
            min-height: 100vh!important;
            background: linear-gradient(135deg, #E6F2FF 0%, #FFFFFF 50%, #F0F7FF 100%)!important
        }
        
        .loginIn .left,
        .loginIn .center,
        .loginIn .right {
            width: 420px!important;
            padding: 42px 34px 32px!important;
            border-radius: 18px!important;
            background: #fff!important;
            border: 1px solid var(--publicBorderColor)!important;
            box-shadow: 0 18px 40px rgba(43, 108, 176, .16)!important
        }
        
        .loginIn .login-form {
            padding: 0!important;
            background: transparent!important
        }
        
        .loginIn .title,
        .loginIn .title-container .title {
            color: var(--publicTextColor)!important;
            font-size: 24px!important;
            font-weight: 700!important;
            margin-bottom: 28px!important
        }
        
        .loginIn .el-input__inner {
            height: 44px!important;
            line-height: 44px!important;
            border-radius: 10px!important
        }
        
        .loginInBt {
            width: 100%!important;
            height: 44px!important;
            line-height: 44px!important;
            border-radius: 8px!important;
            background: linear-gradient(135deg, var(--publicMainColor) 0%, var(--publicMainColorDeep) 100%)!important;
            color: #fff!important;
            box-shadow: 0 10px 24px rgba(49, 130, 206, .2)!important
        }
        
        .loginIn .register,
        .loginIn .reset {
            color: var(--publicMainColor)!important
        }
        
        .content .main-text {
            padding: 28px 32px!important;
            background: #fff!important;
            border: 1px solid var(--publicBorderColor)!important;
            border-radius: 16px!important;
            box-shadow: var(--publicShadow)!important;
            color: var(--publicTextColor)!important;
            font-size: 28px!important;
            font-weight: 700!important
        }
    </style>
</head>
